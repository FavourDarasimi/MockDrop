<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A payload dropping into an endpoint: the brace pair is the JSON, the
       filled dot is the live URL it becomes. Same 1.5px-equivalent stroke
       language as the inline icon set, scaled for a 32px canvas. -->
  <rect width="32" height="32" rx="7" fill="#0F172A" />
  <g
    fill="none"
    stroke="#10B981"
    stroke-width="2.25"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M12.5 8.5C9.5 8.5 10.5 14.5 7.5 16c3 1.5 2 7.5 5 7.5" />
    <path d="M19.5 8.5c3 0 2 6 5 7.5-3 1.5-2 7.5-5 7.5" />
  </g>
  <circle cx="16" cy="16" r="2.5" fill="#00FFA3" />
</svg>
